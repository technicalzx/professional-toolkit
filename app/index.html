<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Professional Toolkit</title>
<style>
:root{color-scheme:light;--bg:#f4f6fa;--card:#fff;--ink:#18213b;--line:#d9dfec;--accent:#4b46d2}body.dark{color-scheme:dark;--bg:#121627;--card:#1d2339;--ink:#e6ebfa;--line:#39415c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui}header{padding:22px 5%;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}main{max-width:1120px;margin:auto;padding:28px 20px}.intro{padding:20px 0}h1{font-size:36px;margin:0 0 12px}h2{margin-top:0}p{line-height:1.6}.grid{display:grid;grid-template-columns:280px 1fr;gap:24px}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}input,select,textarea{width:100%;padding:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;margin:6px 0 16px;font:inherit}label{display:block;font-weight:600}button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:10px 14px;cursor:pointer;font:inherit}.primary{background:var(--accent);color:white}nav button{display:block;text-align:left;width:100%;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{opacity:.7;font-size:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px system-ui;line-height:1.6}.error{color:#bc344c}.badge{background:var(--bg);padding:7px 12px;border-radius:20px;font-size:13px}.history button{display:block;margin:8px 0;width:100%;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:28px}}
</style><body><header><strong>Professional Toolkit</strong><button id="theme">Toggle theme</button></header><main>
<section class="intro"><span class="badge">Local development · Your data stays in this browser</span><h1>Your professional workspace</h1><p>Practical profile checks and calculators with transparent results. No connected platform or AI service is active.</p></section>
<div class="grid"><aside class="panel"><label for="search">Find a tool</label><input id="search" placeholder="Search audits, pricing, education"><nav id="tools"></nav><h3>Favorites</h3><div id="favorites"></div><h3>Recent results</h3><div id="history" class="history"></div><button id="delete">Delete browser data</button></aside><section class="panel"><h2 id="title"></h2><p class="muted" id="help"></p><form id="form"></form><p id="error" class="error" role="alert"></p><div id="output" aria-live="polite"></div><div class="actions"><button id="copy">Copy result</button><button id="download">Export JSON</button><button id="save">Save result</button><button id="favorite">Favorite tool</button></div></section></div></main>
<script>
const $=id=>document.getElementById(id);
const catalog=[
{id:'audit',name:'Profile completeness audit',category:'Profiles',help:'A presence-only assessment of manually supplied LinkedIn, Upwork or Fiverr information. It does not score quality or predict ranking.',fields:[['platform','Platform','select'],['headline','Headline or title','text'],['summary','About or overview','textarea'],['services','Services and skills','textarea'],['evidence','Portfolio and evidence','textarea'],['cta','Call to action','text']]},
{id:'pricing',name:'Freelance hourly rate',category:'Business',help:'Enter amounts in the same currency. Specify your actual fee; no platform rate is assumed.',fields:[['income','Monthly target income','number'],['costs','Monthly business costs','number'],['hours','Monthly billable hours','number'],['fee','Platform fee (%)','number']]},
{id:'percentage',name:'Marks percentage',category:'Education',help:'Calculate earned marks as a percentage of available marks.',fields:[['earned','Earned marks','number'],['total','Total marks','number']]},
{id:'gpa',name:'Weighted GPA',category:'Education',help:'Enter one course per line: grade point, credits. Use your institution’s scale.',fields:[['scale','Maximum grade point','number'],['courses','Courses (grade point, credits)','textarea']]}
];
let state={favorites:[],history:[],dark:false};try{state={...state,...JSON.parse(localStorage.getItem('professional-toolkit-v1')||'{}')}}catch{}
let active='audit', result=null;
function persist(){try{localStorage.setItem('professional-toolkit-v1',JSON.stringify(state))}catch{$('error').textContent='Browser storage is unavailable or full.'}}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b}
function navigation(){const q=$('search').value.toLowerCase();$('tools').replaceChildren();for(const t of catalog.filter(t=>(t.name+' '+t.category).toLowerCase().includes(q)))$('tools').append(button(t.name,()=>show(t.id)));$('favorites').replaceChildren();for(const id of state.favorites){const t=catalog.find(t=>t.id===id);if(t)$('favorites').append(button(t.name,()=>show(id)))}$('history').replaceChildren();for(const entry of state.history.slice(0,8))$('history').append(button(entry.title+' · '+new Date(entry.date).toLocaleDateString(),()=>{show(entry.tool);result=entry.result;display()}))}
function display(){$('output').replaceChildren();if(result){const p=document.createElement('pre');p.textContent=JSON.stringify(result,null,2);$('output').append(p)}for(const id of ['save','copy','download'])$(id).disabled=!result}
function show(id){active=id;result=null;$('error').textContent='';const t=catalog.find(t=>t.id===id);$('title').textContent=t.name;$('help').textContent=t.help;const form=$('form');form.replaceChildren();for(const [key,label,type] of t.fields){const l=document.createElement('label');l.htmlFor=key;l.textContent=label;const input=document.createElement(type==='textarea'?'textarea':type==='select'?'select':'input');input.id=key;input.name=key;if(type==='select')for(const p of ['LinkedIn','Upwork','Fiverr']){const o=document.createElement('option');o.textContent=p;input.append(o)}else if(type!=='textarea'){input.type=type;if(type==='number'){input.min=0;input.step='any';input.required=true}}if(type==='textarea')input.rows=3;form.append(l,input)}const submit=button('Run tool',()=>{});submit.type='submit';submit.className='primary';const reset=button('Reset',()=>show(active));reset.type='button';form.append(submit,reset);display()}
$('form').onsubmit=async e=>{e.preventDefault();$('error').textContent='';const data=Object.fromEntries(new FormData(e.target));if(active==='gpa')data.courses=data.courses.split('\n').filter(x=>x.trim()).map(line=>{const [grade,credits]=line.split(',');return {grade,credits}});const b=e.target.querySelector('[type=submit]');b.disabled=true;b.textContent='Calculating…';try{const response=await fetch(active==='audit'?'/api/audit':'/api/calculate/'+active,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const out=await response.json();if(!response.ok)throw Error(out.error);result=out;display()}catch(err){$('error').textContent=err.message}finally{b.disabled=false;b.textContent='Run tool'}};
$('theme').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);persist()};
$('search').oninput=navigation;
$('favorite').onclick=()=>{state.favorites=state.favorites.includes(active)?state.favorites.filter(x=>x!==active):[...state.favorites,active];persist();navigation()};
$('save').onclick=()=>{if(!result)return;state.history.unshift({tool:active,title:catalog.find(t=>t.id===active).name,date:new Date().toISOString(),result});state.history=state.history.slice(0,50);persist();navigation()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(result,null,2))}catch{$('error').textContent='Clipboard unavailable. Select and copy the result text.'}};
$('download').onclick=()=>{if(!result)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=active+'-result.json';a.click();URL.revokeObjectURL(url)};
$('delete').onclick=()=>{state.history=[];state.favorites=[];persist();navigation();show(active)};
document.body.classList.toggle('dark',state.dark);navigation();show(active);
</script></body></html>
